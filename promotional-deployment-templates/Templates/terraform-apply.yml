parameters:
  - name: environment
    type: string

  - name: serviceConnection
    type: string

  - name: variable_group
    type: string

jobs:
  - job: Terraform_Apply_${{ parameters.environment }}
    displayName: "Terraform Apply - ${{ parameters.environment }}"

    variables:
      - group: ${{ parameters.variable_group }}

    steps:
      - task: TerraformInstaller@1
        displayName: "Install Terraform"
        inputs:
          terraformVersion: "1.5.0"

      - task: TerraformTaskV4@4
        displayName: "Terraform Init"
        inputs:
          provider: "azurerm"
          command: "init"
          workingDirectory: "$(System.DefaultWorkingDirectory)/terraform/${{ parameters.environment }}"
          backendServiceArm: ${{ parameters.serviceConnection }}
          backendAzureRmResourceGroupName: "$(tf_backend_rg)"
          backendAzureRmStorageAccountName: "$(tf_backend_sa)"
          backendAzureRmContainerName: "$(tf_backend_container)"
          backendAzureRmKey: "${{ parameters.environment }}.tfstate"

      - task: DownloadBuildArtifacts@0
        displayName: "Download Terraform Plan"
        inputs:
          buildType: "current"
          downloadType: "single"
          artifactName: "tfplan-${{ parameters.environment }}"
          downloadPath: "$(System.DefaultWorkingDirectory)/terraform/${{ parameters.environment }}"

      - task: TerraformTaskV4@4
        displayName: "Terraform Apply"
        inputs:
          provider: "azurerm"
          command: "apply"
          workingDirectory: "$(System.DefaultWorkingDirectory)/terraform/${{ parameters.environment }}"
          environmentServiceNameAzureRM: ${{ parameters.serviceConnection }}
          commandOptions: "tfplan"
